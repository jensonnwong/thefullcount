<html lang="en">

<meta charset="utf-8">

<meta name="theme-color" content="#0d1b30">
<style>
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<title>The Full Count</title>

<style>
/* Layout: one narrow column styled like a hand-operated ballpark scoreboard; board up top, the duel below. Single dark look by choice. */
:root{
  /* Navy night-game stands, baseball-white chalk, glove-leather brown, infield dirt, outfield grass */
  --board:#0d1b30; --panel:#142640; --panel2:#1b3152; --line:#2d4770;
  --chalk:#f6f3ec; --dim:#a7b5cb; --leather:#d0955a; --ink:#0d1b30; --ink-soft:#5a3c1f;
  --green:#6fcf8a; --red:#e8574a; --dirt:#a86e3e; --grass:#2f7d47; --grass2:#286c3d;
  --sb:#08132a; --sb-line:#25416b; --now:#1e3760; --bulb:#16294a; --bulb-line:#2a4570;
  --aim:#2f5a8f; --os:#8fb7e8; --yes-bg:#1f5a37; --near-bg:#5a4320; --no-bg:#5a2424; --hot:#c0362c; --cold:#3b82d9;
  /* type scale: text 12 / 14 / 16 / 18 · display 20 / 22 / 28 / 36 / hero */
  --display:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;
  --body:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--board);color:var(--chalk)}
body{font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--leather);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance;line-height:1}
.lbl{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.muted{color:var(--dim)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.mast{display:flex;flex-direction:column;gap:6px;padding-top:8px}
.mast h1{font-size:clamp(48px,15vw,76px);font-weight:900;line-height:.86}

.mast h1 .dirt{color:transparent;background:var(--grain) 0 0/72px 72px,linear-gradient(180deg,#f3cd98 0%,#d9a066 40%,#b4733f 72%,#7f4a22 100%);-webkit-background-clip:text;background-clip:text;display:inline-block;padding-right:.04em}
@supports not ((-webkit-background-clip:text) or (background-clip:text)){.mast h1 .stitched{color:var(--chalk);background:none}.mast h1 .dirt{color:var(--leather);background:none}}
.mast p{margin:0;color:var(--dim);max-width:40ch}
.mast::after{content:"";display:block;height:10px;margin-top:6px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--grass) 0 28px,var(--grass2) 28px 56px);border-bottom:3px solid var(--dirt)}
.field{display:flex;flex-direction:column;gap:6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.opt{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:10px 8px;text-align:center;font-weight:600;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;min-width:0}
.opt small{font-weight:500;font-size:12px;color:var(--dim);line-height:1.2}
.opt[aria-pressed="true"]{background:var(--leather);border-color:var(--leather);color:var(--ink)}
.opt[aria-pressed="true"] small{color:#2a1a0c;font-weight:700;text-shadow:0 1px 0 rgba(250,220,180,.55)}
.opt:disabled{opacity:.4;cursor:not-allowed}
.btn{background:var(--leather);color:var(--ink);border:0;border-radius:5px;padding:14px 16px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.btn:disabled{opacity:.35;cursor:not-allowed}

.btn:not(.ghost),.opt[aria-pressed="true"],.rt.on,.chip.bp,.check[aria-checked="true"] .box{background-image:var(--grain),linear-gradient(180deg,rgba(255,236,205,.10),rgba(90,55,25,.12));background-size:96px 96px,100% 100%}
.btn:not(.ghost),.opt[aria-pressed="true"]{text-shadow:0 1px 0 rgba(255,232,196,.35)}

.btn.ghost{background:transparent;color:var(--chalk);border:1px solid var(--line);font-size:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
details{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 16px}
summary{font-weight:700;cursor:pointer}
details ul{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--dim)}
details b{color:var(--chalk)}
/* draft */
.dots{letter-spacing:2px;color:var(--leather);font-size:14px;white-space:nowrap}
.dots i{font-style:normal;color:var(--line)}
.chip{font-size:12px;font-weight:600;letter-spacing:.02em;padding:2px 7px;border-radius:999px;background:rgba(167,181,203,.12);border:0;color:var(--dim);white-space:nowrap}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:10px 12px}
.prow .nm{font-weight:700;font-size:18px;min-width:0}
.prow .tm{color:var(--dim);font-weight:500;font-size:14px;margin-left:6px}
.prow .ds{grid-column:1/-1;font-size:14px;color:var(--dim)}
.prow[aria-pressed="true"]{border-color:var(--leather);box-shadow:inset 0 0 0 1px var(--leather)}
.prow[aria-pressed="true"] .nm::before{content:"✓ ";color:var(--leather)}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{background:var(--board);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-size:14px;font-weight:600}
.pick em{font-style:normal;color:var(--leather);font-family:var(--display);margin-right:4px}
/* scoreboard */
.board{background:var(--sb);border:3px solid var(--sb-line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px}
.line-wrap{overflow-x:auto}
table.line{border-collapse:collapse;width:100%;font-family:var(--display);font-variant-numeric:tabular-nums}
.line th,.line td{padding:3px 4px;text-align:center;font-size:18px;min-width:20px}
.line thead th{font-size:12px;color:var(--dim);font-weight:600}
.line td.tn{min-width:64px;text-align:left;font-family:var(--body);font-weight:700;font-size:14px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
.line td.r{color:var(--leather);font-size:22px;font-weight:900;border-left:2px solid var(--sb-line)}
.line td.now{background:var(--now)}
.line tr.bat td.tn::before{content:"▶ ";color:var(--leather)}
.bso{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-family:var(--display);font-weight:900;font-size:22px;line-height:1;
  background:#f7f2e3;color:#1c2c52;border-radius:0 0 3px 3px;padding:10px 12px;margin:2px -10px -10px;border-top:2px solid var(--sb-line)}
.bso span{display:flex;gap:6px;align-items:center}
.bso .bulb{width:17px;height:17px;background:#e2d6bb;border:1.5px solid #b1a280;box-shadow:none}
.bso .bulb.on{box-shadow:none}
.bso .bulb.on.b{background:#2f8f4e;border-color:#1d5c32}
.bso .bulb.on.s{background:#d08a3e;border-color:#8a5426}
.bso .bulb.on.o{background:#c8412f;border-color:#7d2419}
.bso .chip{background:#1c2c52;color:#f7f2e3;border-color:#1c2c52;font-size:12px}
.bso .inn{color:#1c2c52;font-size:22px}

.rv-name{font-family:var(--display);font-weight:900;font-size:clamp(32px,10vw,44px);text-transform:uppercase;line-height:1;text-align:center}
.stt{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.stt th,.stt td{padding:7px 0;border-top:1px solid var(--line);font-weight:500}
.stt tr:first-child th,.stt tr:first-child td{border-top:0}
.stt tbody th{text-align:left;color:var(--dim);font-weight:500}
.stt td{text-align:right;color:var(--chalk);font-weight:700;white-space:nowrap}
.stt.grid thead th{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:right;padding:0 0 6px;border:0}
.stt.grid thead th:first-child{text-align:left}
.stt.grid tbody tr:first-child th,.stt.grid tbody tr:first-child td{border-top:1px solid var(--line)}
.stt.grid tbody th{color:var(--chalk);font-weight:600;max-width:0;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
.stt.grid td{padding-left:12px;min-width:30px}
.mix{display:flex;flex-direction:column;gap:12px}
.mix-row{display:flex;flex-direction:column;gap:5px}
.mix-l{font-size:14px;color:var(--dim)}
.mix-bar{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--board);gap:2px}
.mix-bar i{display:block;height:100%}.mix-bar i.none{flex:1;background:var(--line)}
.mix .m0{background:var(--leather)}.mix .m1{background:var(--os)}.mix .m2{background:var(--green)}
.mix-key{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--dim)}
.mix-key span{display:inline-flex;align-items:center;gap:5px}.mix-key i{width:9px;height:9px;border-radius:2px;display:inline-block}.mix-key b{color:var(--chalk);font-variant-numeric:tabular-nums}
.statrows{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}.statrows span{color:var(--dim)}.statrows b{text-align:right;font-variant-numeric:tabular-nums}
.pin{letter-spacing:.4em;font-family:var(--display);font-size:22px;max-width:160px}
.bn{font-family:var(--body)!important;font-size:16px!important;letter-spacing:0!important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board-list li{grid-template-columns:28px minmax(0,1fr);align-items:center}.bcell{display:flex;flex-direction:column;min-width:0}

.mgr{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.mgr>div:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.mgrname{font-family:var(--display);font-weight:900;font-size:28px;text-transform:uppercase;line-height:1}
.mgrstats{display:flex;gap:16px}.mgrstats span{display:flex;flex-direction:column;align-items:flex-end}
.mgrstats b{font-family:var(--display);font-weight:900;font-size:22px;line-height:1}.mgrstats small{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.coinval{color:var(--chalk)}
.mgrin{flex:1;min-width:0;background:var(--board);border:1px solid var(--line);border-radius:5px;color:var(--chalk);font:inherit;font-size:18px;font-weight:600;padding:10px 12px}
.linkbtn{background:none;border:0;padding:0;color:var(--leather);font:inherit;font-size:14px;font-weight:700;text-decoration:underline;cursor:pointer;text-transform:none;letter-spacing:0}
.crow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.crow:first-of-type{border-top:0}
.crow .nm{font-weight:700;font-size:16px;min-width:0}.crow .tm{display:block;color:var(--dim);font-weight:500;font-size:12px}
.crow>.row{grid-column:1}
.crow>:last-child{grid-row:1/3;grid-column:2}
.btn.buy{font-size:18px;padding:8px 12px}
.chip.lock{background:transparent;color:var(--dim);border-style:dashed}
.chip.own{background:#1f5a37;border-color:#2f7d47}
.prow.locked .nm{color:var(--dim)}
.coins .coinbig{font-family:var(--display);font-weight:900;font-size:28px;color:var(--leather)}
.coinlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:14px}
.coinlist li{display:flex;justify-content:space-between;color:var(--dim)}.coinlist b{color:var(--chalk)}

/* clubhouse art behind player selection and upgrade screens */
body.clubbg{background:transparent}
body.clubbg::before{content:"";position:absolute;left:0;right:0;top:0;height:300px;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(13,27,48,.55) 0%,rgba(13,27,48,.8) 55%,var(--board) 100%),url(art/clubhouse.jpg) 50% 24%/cover no-repeat;filter:saturate(.75)}
body{position:relative}
/* team crests */
.crest{display:block;flex:none}
.mgr-id{display:flex!important;flex-direction:row!important;align-items:center;gap:12px;min-width:0}
.mgr-id>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.crest-btn{background:none;border:0;padding:0;border-radius:50%;position:relative}
.crest-btn::after{content:"Edit";position:absolute;left:50%;transform:translateX(-50%);bottom:-6px;background:var(--leather);color:var(--ink);font-family:var(--display);font-weight:900;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:1px 5px;border-radius:2px}
.board-list li{grid-template-columns:28px 30px minmax(0,1fr)!important}
.sbt .tn .crest,.line .tn .crest{display:inline-block;vertical-align:-3px;margin-right:5px}
.fs-team .crest{margin-bottom:4px}
.crestpick{display:flex;flex-direction:column;gap:14px}
.cp-prev{display:flex;justify-content:center;padding:4px 0}
.cp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.cp-opt,.cp-sw{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px;display:flex;align-items:center;justify-content:center;aspect-ratio:1}
.cp-opt[aria-pressed="true"],.cp-sw[aria-pressed="true"]{border-color:var(--leather);box-shadow:0 0 0 2px var(--leather)}
.cp-sw{gap:0;padding:8px}.cp-sw i{flex:1;height:100%;display:block}.cp-sw i:first-child{border-radius:4px 0 0 4px}.cp-sw i:last-child{border-radius:0 4px 4px 0}

/* ---------- program cover ---------- */
.cover{position:relative;margin-top:4px;background:var(--cream);border-radius:6px;padding:8px;box-shadow:0 0 0 2px var(--leather),0 12px 28px #0008}
.cv-in{position:relative;border:2px solid var(--navyink);border-radius:3px;overflow:hidden;background:var(--cream);display:flex;flex-direction:column}
.cv-top{display:flex;justify-content:space-between;padding:9px 12px 0;font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--navyink)}
.cv-top span:last-child{color:var(--stitch)}
.cv-title{margin:2px 0 4px;padding:0 10px;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(42px,13vw,80px);line-height:.9;letter-spacing:.005em;white-space:nowrap;text-align:center}
.cv-title span{color:transparent;padding-right:.03em}
.cv-title .full{background:var(--stitchimg) 0 0/100% 100% no-repeat,var(--navyink)}
.cv-title .count{background:var(--grain) 0 0/72px 72px,linear-gradient(180deg,#c98a4e,#9c5f2c 60%,#6e3f1b)}
.cv-title .the{display:block;font-size:.3em;letter-spacing:.32em;color:#c8412f;-webkit-text-fill-color:#c8412f;margin:0 0 .12em .2em;line-height:1}
.cv-title .full,.cv-title .count{-webkit-background-clip:text;background-clip:text}
.cv-art{position:relative;aspect-ratio:900/746;border-top:2px solid var(--navyink)}
.cv-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cv-card{position:absolute;top:64.6%;width:5.6%;height:11.8%;display:grid;place-items:center;background:#f3ecd9;color:#14213f;border-radius:1px;
  font-family:var(--display);font-style:normal;font-weight:900;font-size:clamp(14px,5.6vw,30px);line-height:1;box-shadow:0 0 0 1px rgba(20,33,63,.35),0 2px 0 rgba(20,33,63,.45);transform-origin:50% 0}
.cv-card::before{content:"";position:absolute;top:-7%;left:50%;width:22%;aspect-ratio:1;margin-left:-11%;border-radius:50%;background:#14213f;opacity:.75}
@media (prefers-reduced-motion:no-preference){.cv-card{animation:cardFlip .55s var(--d) cubic-bezier(.3,1.4,.5,1) both}@keyframes cardFlip{from{transform:perspective(200px) rotateX(-100deg);opacity:.2}}}
.cv-grass{height:8px;background:repeating-linear-gradient(90deg,var(--grass) 0 22px,var(--grass2) 22px 44px);border-bottom:3px solid var(--dirt);border-top:2px solid var(--navyink)}
.cv-band{white-space:nowrap;background:var(--navyink);color:var(--cream);padding:7px 12px 6px;font-family:var(--display);font-weight:800;font-size:clamp(10px,3vw,15px);letter-spacing:.03em;text-transform:uppercase;display:flex;justify-content:space-between;gap:6px}
.cv-band i{font-style:normal;color:var(--leather)}
.newhere{margin:-4px 0 0;text-align:center;font-size:16px;color:var(--dim)}
.newhere a{color:var(--chalk);font-weight:700;text-underline-offset:3px}

/* ---------- ticket stub ---------- */
.ticket{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;border:0;
  padding:12px 14px 12px 14px;border-radius:6px;color:var(--navyink);
  background:radial-gradient(circle at 0 50%,var(--board) 9px,transparent 9.5px),radial-gradient(circle at 100% 50%,var(--board) 9px,transparent 9.5px),
    radial-gradient(rgba(28,44,82,.08) 1px,transparent 1.3px) 0 0/6px 6px,linear-gradient(180deg,var(--cream),var(--cream2))}
.ticket::after{content:"";position:absolute;top:10px;bottom:10px;right:108px;border-left:2px dashed rgba(28,44,82,.35)}
.tk-id{min-width:0;display:flex;flex-direction:column;gap:2px}
.tk-k{font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#5b6788}
.tk-name{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:22px;line-height:.92;overflow-wrap:anywhere}
.tk-rec{font-size:14px;font-weight:600;color:#3d4a6b}
.tk-side{width:96px;display:flex;flex-direction:column;align-items:center;gap:2px;padding-left:8px}
.tk-coins{font-family:var(--display);font-weight:900;font-size:22px;display:flex;align-items:center;gap:4px}
.tk-go{white-space:nowrap;font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--navyink)}
.coin{display:inline-block;width:.75em;height:.75em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f4d58a,#c9973e 70%);box-shadow:inset 0 0 0 1.5px #8a6127}
.crest{display:block;flex:none}

/* ---------- slim leaderboard ---------- */
.lb{display:flex;flex-direction:column;gap:8px}
.lb-h{display:flex;justify-content:space-between;align-items:baseline}
.lb-h a{color:var(--dim);font-size:14px;text-underline-offset:3px}
.lb ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lb li{display:grid;grid-template-columns:22px 22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 2px;border-top:1px solid var(--line)}
.lb li:first-child{border-top:0}
.lb .rk{font-family:var(--display);font-weight:900;font-size:18px;color:var(--dim)}
.lb .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .st{font-size:14px;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.lb li.me .nm{color:var(--chalk)}.lb li.me .rk{color:var(--chalk)}
.lb li.me{background:rgba(247,242,227,.05)}
.foot{display:flex;justify-content:center;gap:18px;padding-top:4px}
.foot button{background:none;border:0;color:var(--dim);font-size:16px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.foot button span{color:var(--leather)}
.modeseg .opt[aria-pressed="true"]{background:var(--chalk);border-color:var(--chalk);color:var(--ink);background-image:none}
.modeseg .opt[aria-pressed="true"] small{color:#3d4a6b;text-shadow:none}
.linkbtn.mid{align-self:center}
.ptag{align-self:flex-start;font-family:var(--display);font-weight:900;font-size:13px;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px 3px;border-radius:2px;color:#f7f2e3;box-shadow:2px 2px 0 #0b1426}
.ptag.p-a{background:#3f6fb5}.ptag.p-b{background:#a8324f}
body[data-side="b"]{--board:#26101a;--panel:#3a1624;--panel2:#4b1d2f;--line:#713149;--sb:#1d0a12;--sb-line:#5c2639;--now:#4b1d2f;--bulb:#2e1220;--bulb-line:#5c2639;--dim:#d0a9b6}
html:has(body[data-side="b"]){background:#26101a}
body{transition:background-color .35s}
body.two-p .sbt tr.side-a td.tn{box-shadow:inset 4px 0 0 #3f6fb5}
body.two-p .sbt tr.side-b td.tn{box-shadow:inset 4px 0 0 #a8324f}
body[data-side] .card.hand{border-width:2px}
body[data-side="a"].two-p .card.hand{border-color:#3f6fb5}body[data-side="b"] .card.hand{border-color:#c24a68}
.btn.cream{background:#f7f2e3;color:#1c2c52;background-image:radial-gradient(rgba(28,44,82,.07) 1px,transparent 1.3px);background-size:6px 6px;text-shadow:none;box-shadow:inset 0 0 0 2px #1c2c52,inset 0 0 0 4px #f7f2e3,inset 0 0 0 5px rgba(28,44,82,.3)}
.linkbtn{color:var(--dim)!important;font-weight:500}.tk-k{white-space:nowrap}
.ticket .crest{width:54px;height:54px}
.lb li .crest{width:22px;height:22px}
.paper{position:relative;color:#1c2c52;border-radius:5px;padding:14px;background:radial-gradient(rgba(28,44,82,.08) 1px,transparent 1.3px) 0 0/6px 6px,linear-gradient(180deg,#f7f2e3,#efe6cf);
 box-shadow:inset 0 0 0 1.5px #1c2c52,inset 0 0 0 5px #f7f2e3,inset 0 0 0 6px rgba(28,44,82,.35),0 10px 22px #0008}
.bx-top,.tk-top{display:flex;justify-content:space-between;font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.bx-top span:last-child,.tk-top span:last-child{color:#c8412f}
.bx-head{display:flex;flex-direction:column;align-items:center;text-align:center;margin:10px 0 4px}
.bx-w{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(32px,10vw,46px);line-height:.9}

  const exp=Math.max(2,cfg.innings)*P_INN, th=Math.round(exp*0.7)+Math.round(exp*0.12)*sp(pl,'Workhorse')+(pl&&pl.stam?Math.round(exp*0.15):0), range=Math.max(10,Math.round(exp*0.3));
  const over=Math.min(1,Math.max(0,(pc-th)/range));
  return {f:cfg.stamina?over:0, energy:pc<th?1-0.3*pc/th:0.7*(1-over)};
}

const isCorner=(bc,N)=>(bc.r<0||bc.r>=N)&&(bc.c<0||bc.c>=N);

    if(tunnel){w+=p.type==='Changeup'?0.6:0.45;why.push(`the ${p.type.toLowerCase()} tunneled off the ${prevType.toLowerCase()}`)}

}

const Organ=(()=>{

    [69,1],[68,1],[69,1],[64,1],[65,1],[67,1],[69,2],[65,1],[62,3],
    [69,2],[69,1],[69,1],[71,1],[72,1],[74,1],[71,1],[69,1],[67,1],[64,1],[62,1],
    [60,2],[72,1],[69,1],[67,1],[64,1],[67,3],[62,3],
    [62,2],[60,1],[62,2],[64,1],[65,2],[67,1],[69,3],
    [69,1],[71,2],[72,3],[72,3],
    [72,2],[71,1],[69,1],[67,2],[66,1],[67,1],[69,1],[71,3],[72,3]];
  const BARS=['C','C','G7','G7','C','C','A7','A7','Dm','A7','Dm','Dm','D7','D7','G7','G7','C','C','G7','G7','D7','D7','G7','G7','G7','C','C','C','C','D7','G7','C'];
  const CH={C:[48,[60,64,67]],G7:[43,[59,62,65]],A7:[45,[61,64,67]],Dm:[50,[62,65,69]],D7:[50,[60,62,66]]};
  const BEAT=60/170,BAR=3*BEAT,LEN=BARS.length*BAR;
  let ctx=null,out=null,wave=null,timer=0,loopStart=0,queued=0,on=false;
  const hz=m=>440*Math.pow(2,(m-69)/12);

    const o=ctx.createOscillator(),g=ctx.createGain();o.setPeriodicWave(wave);o.frequency.value=hz(m);

    BARS.forEach((c,i)=>{const [bass,chord]=CH[c],t=t0+i*BAR;note(bass,t,BEAT*0.9,0.20);chord.forEach(n=>{note(n,t+BEAT,BEAT*0.5,0.05);note(n,t+2*BEAT,BEAT*0.5,0.05)})});

    start(){try{

    }catch(e){on=false}},
    stop(){on=false;clearInterval(timer);if(ctx){ctx.suspend().catch(()=>{})}},
    get playing(){return on}
  };
})();

function recordGame(){
  const {g,cfg,teams}=G();if(g.recorded)return g.recorded;g.recorded=[];
  const pl=g.plog||[];
  teams.forEach((side,i)=>{
    const t=side.mgr==='me'?T.me:side.mgr==='p2'&&T.p2?T.p2.team:null;if(!t)return;
    const op=1-i,won=g.runs[i]>g.runs[op],tie=g.runs[i]===g.runs[op];
    const casual=!cfg.ladder&&teams[op].human&&!teams[op].mgr;  /* head to head vs a casual player: record counts, coins at half rate */
    t.record[won?'w':tie?'t':'l']++;t.games++;
    const bat=pl.filter(e=>e.off===i),pit=pl.filter(e=>e.off===op),endsB=bat.filter(e=>e.end),endsP=pit.filter(e=>e.end);
    const ab=endsB.filter(e=>e.end!=='Walk'&&e.end!=='Sacrifice fly').length,H=endsB.filter(e=>e.hit>=1).length,HR=endsB.filter(e=>e.hit===4).length;
    const BB=endsB.filter(e=>e.end==='Walk').length,K=endsB.filter(e=>e.end==='Strikeout').length,PK=endsP.filter(e=>e.end==='Strikeout').length;
    const s=t.stats;s.ab+=ab;s.h+=H;s.hr+=HR;s.bb+=BB;s.k+=K;s.r+=g.runs[i];s.pk+=PK;s.ra+=g.runs[op];s.pitches+=pit.length;
    const td=t.tend;pit.forEach(e=>{const f=FAM[e.type];if(f)td[f]++});bat.forEach(e=>{if(e.swing){td.swings++;if(e.pw)td[e.pw]++}else td.takes++});
    const ps=t.pstats;
    endsB.forEach(e=>{const id=baseId(e.b),x=ps[id]=ps[id]||{};if(e.end!=='Walk'&&e.end!=='Sacrifice fly')x.ab=(x.ab||0)+1;if(e.hit>=1)x.h=(x.h||0)+1;if(e.hit===4)x.hr=(x.hr||0)+1;if(e.end==='Walk')x.bb=(x.bb||0)+1;if(e.end==='Strikeout')x.k=(x.k||0)+1;x.rbi=(x.rbi||0)+(e.runs||0)});
    pit.forEach(e=>{const id=baseId(e.p),x=ps[id]=ps[id]||{};x.np=(x.np||0)+1;if(e.end==='Strikeout')x.pk=(x.pk||0)+1;if(e.hit>=1)x.ha=(x.ha||0)+1;x.ra=(x.ra||0)+(e.runs||0)});
    const inn=cfg.ladder?1:Math.max(1,g.inning),items=[[`${won?'Win':tie?'Tie':'Game played'} · ${inn} inning${inn>1?'s':''}`,(won?PAY_INN.win:tie?PAY_INN.tie:PAY_INN.loss)*inn]];
    if(won&&!casual&&t.bonusDay!==todayKey()){t.bonusDay=todayKey();items.push(["First win of the day",DAILY_WIN])}
    if(H)items.push([`Hits × ${H}`,H*2]);if(HR)items.push([`Home runs × ${HR}`,HR*5]);if(PK)items.push([`Strikeouts × ${PK}`,PK]);
    if(cfg.ladder&&S.ladder&&S.ladder.last&&side.mgr==='me'){const L=S.ladder.last;if(L.won){const st=LAD_SITS[L.sit||0];items.push([`Ladder level ${L.level} cleared${st.d?` · from ${st.name.toLowerCase()}`:''}`,ladClear(L.level,st)]);if(L.level%3===0){t.picks++;items.push([`Scout pick for level ${L.level}`,0])}}t.ladderBest=Math.max(t.ladderBest||0,S.ladder.wins)}
    if(won&&!casual&&t.record.w%3===0){t.picks++;items.push([`Scout pick for ${t.record.w} wins`,0])}
    if(casual){items.forEach(x=>x[1]=Math.round(x[1]*CASUAL_RATE));items.push(['Vs. casual player · half coins, no bonuses',0])}
    const total=items.reduce((a,x)=>a+x[1],0);t.coins+=total;
    g.recorded.push({name:t.name,items,total,coins:t.coins});

/* ---------- Walk-off ladder (manager teams only) ---------- */
const TIERS=[[2,'Rookie Ball'],[4,'Double-A'],[6,'Triple-A'],[8,'The Show'],[10,'All-Stars'],[99,'Hall of Famers']];
const tierName=l=>TIERS.find(t=>l<=t[0])[1];
const ladBudget=l=>Math.min(18,7+l), ladSkill=l=>Math.min(1,(l-1)*0.1);

/* Start the 9th behind for a bigger level-clear bonus. A loss still ends the run. */
const LAD_SITS=[{d:0,name:'Tied',mult:1,hint:'Even game'},{d:1,name:'Down 1',mult:1.5,hint:'×1.5 bonus'},{d:2,name:'Down 2',mult:2,hint:'×2 bonus'},{d:3,name:'Down 3',mult:3,hint:'×3 bonus'}];
const ladSit=()=>LAD_SITS[(S.ladder&&S.ladder.sit)||0];
const ladClear=(lv,sit)=>Math.round((20+5*lv)*sit.mult);
function newLadder(){S.ladder={level:1,wins:0,mem:{bf:{},bc:{},pf:{},pc:{}},over:false};S.screen='ladder'}
function startLadderGame(){
  const L=S.ladder,lv=L.level;
  L.cpu=L.cpu&&L.cpu.lv===lv?L.cpu:{lv,roster:cpuRoster(ladBudget(lv))};
  const cfg={...S.cfg,mode:'cpu',innings:9,ladder:true,skill:ladSkill(lv)};
  const me=sideFrom(T.me.roster,'A',T.me.name,{mgr:'me'});
  const cpu=sideFrom(L.cpu.roster.map(id=>autoBuild(id,ladLvl(lv))),'C',tierName(lv),{human:false});
  const sit=ladSit();L.playSit=sit.d;
  startGame(cfg,[cpu,me],true);
  const g=G().g,tie=Math.floor(rnd()*4);
  g.inning=9;g.line=[[],[]];
  for(let i=0;i<8;i++){g.line[0][i]=0;g.line[1][i]=0}
  for(let k=0;k<tie;k++){g.line[0][Math.floor(rnd()*8)]++;g.line[1][Math.floor(rnd()*8)]++}
  for(let k=0;k<sit.d;k++)g.line[0][Math.floor(rnd()*8)]++;
  g.line[0][8]=0;g.runs=[tie+sit.d,tie];
  G().teams.forEach(t=>t.order=Math.floor(rnd()*6));
  g.log=[{hl:'Top 9',txt:sit.d?`Down ${tie+sit.d}-${tie}. Hold them, then rally.`:`Tied ${tie}-${tie}. Hold them here.`}];
  beginPitch();
}
function finishLadderGame(){
  const L=S.ladder,g=G().g;if(g.ladderDone)return;g.ladderDone=true;
  const won=g.runs[1]>g.runs[0];L.last={won,level:L.level,score:[...g.runs],sit:L.playSit||0};
  if(won){L.wins++;L.level++}else L.over=true;
}

function cpuRoster(budget){
  const shuffle=a=>a.map(x=>[rnd(),x]).sort((a,b)=>b[0]-a[0]).map(x=>x[1].id);
  let best=null;
  for(let t=0;t<2000;t++){
    const nb=2+Math.floor(rnd()*3);
    const r=[...shuffle(BATTERS).slice(0,nb),...shuffle(PITCHERS).slice(0,ROSTER-nb)],c=cost(r);
    if(c<=budget&&(!best||c>cost(best)))best=r;
    if(best&&cost(best)===budget)break;
  }
  return best;
}

function tapArea(list,r,c,cur){
  const cands=list.map((a,i)=>{if(!inArea(a,r,c))return null;const cy=a.reduce((s,x)=>s+x[0],0)/a.length,cx=a.reduce((s,x)=>s+x[1],0)/a.length;return{i,d:(cy-r)**2+(cx-c)**2}}).filter(Boolean).sort((a,b)=>a.d-b.d);
  const k=cands.findIndex(x=>x.i===cur);
  return k>=0?cands[(k+1)%cands.length].i:cands[0].i;
}

function rules(open){
  return `<details id="how"${open?' open':''}><summary>How to play</summary><ul>
  <li><b>Pitcher</b> picks one of his three pitches, an effort and a spot, or throws a ball on purpose.</li>
  <li><b>Effort:</b> Finesse lands exactly but hits can carry an extra base. Normal lands somewhere in a smaller area. Max only aims at the zone and knocks hits down a base. Harder throws miss more.</li>
  <li><b>Control:</b> every pitcher is Pinpoint, Average or Wild. It sets how often he misses his spot, at every effort level. A miss either sails out of the zone for a ball (batters lay off most of those) or leaves the pitch over the plate, where it's easier to hit hard. Tired arms miss more.</li>
  <li><b>Batter</b> takes or swings. A swing reads the pitch, a power level and a spot.</li>
  <li><b>Power:</b> Contact picks the left or right side of the zone and mostly hits singles. Normal covers a 2×2 area on Hard, or any half (top, bottom, left, right) on Medium. Power needs the exact spot, hits for extra bases, and can swing through a pitch it read.</li>
  <li><b>Results:</b> right pitch and right spot puts it in play with your power level. Right spot, wrong pitch is usually a foul, sometimes weak contact. Right pitch, spot just next to yours often comes off the end of the bat. Right pitch, wrong spot can still be fouled off or popped up on timing. Wrong pitch and wrong spot is usually a miss. Any foul can be caught for an out.</li>
  <li><b>Balls:</b> batters often recognize a ball and hold up, and Eye hitters more so. Taken pitches on the edge of the zone are sometimes called balls.</li>
  <li><b>Counts matter:</b> in hitter's counts (2-0, 3-0, 3-1, 2-1) Normal and Power swings miss less and hit harder. With two strikes and fewer than two balls, Stuff pitchers play a level stronger.</li>
  <li><b>Pitch traits:</b> 4-seamers hold the zone at Max. Sinkers get grounders. Cutters jam. Sliders and sweepers break late. Curveballs punish wrong reads. Changeups and splitters tunnel off a fastball thrown right before. Throwing the same pitch twice in a row helps the batter time it.</li>
  <li><b>${ICO.star} Signature pitch:</b> the pitcher's specialty plays one level stronger on it.</li>
  <li><b>Hot and cold zones:</b> each hitter crushes one part of the zone and struggles in another. The pitcher sees them tinted on his zone.</li>
  <li><b>Balls:</b> tap the shaded border around the zone to throw a ball to that spot. A chase close to the batter's swing can still be fouled off or poked in play. Corners are easiest to lay off. Normal and Max balls sometimes catch the edge for a strike.</li>
  <li><b>On base:</b> ground balls with a runner on first can be double plays. Fly balls with a runner on third can score him. Runners can steal 2nd or 3rd, never home. Pitchers answer with a quick step (no Max effort) or a pitchout (a wasted ball).</li>
  <li><b>Extra innings:</b> every extra half-inning starts with a runner on second, unless you turn that off on the setup screen.</li>

  <li><b>Levels and builds:</b> every player has 5 levels and earns 1 build point per level. His upgrades are worth more than 5 points, so each manager builds him differently, but never past his real profile.</li>
  <li><b>Modes:</b> vs. CPU, head to head on one phone, and the ladder (saved teams only). A casual player facing a saved team picks the same mix of Stars, Starters and Role players. Two casual players play an exhibition with every player. Saved teams always keep their record.</li>
  </ul></details>`;
}

  ${g.log.length?`<section class="card"><span class="lbl">Last plays</span><ul class="log">${g.log.slice(0,3).map(l=>`<li><b>${l.hl}</b> · ${esc(l.txt)}</li>`).join('')}</ul></section>`:''}
  <button class="btn" data-bar data-a="report-next">${label}</button>`;
}

const app=typeof document!=='undefined'?document.getElementById('app'):null;
function render(){
  if(!app)return;
  clearSplash();
  const needT=['club','player','swap','ladder','crest'];if(needT.includes(S.screen)&&!T.me)S.screen='home';
  document.body.classList.toggle('clubbg',CLUB_BG.includes(S.screen));
  document.body.dataset.side=S.screen==='game'?(turnColor()||''):'';
  document.body.classList.toggle('two-p',S.screen==='game'&&G().teams.filter(t=>t.human).length===2);
  app.innerHTML=S.screen==='home'?home():S.screen==='login'?login():S.screen==='starter'?starterScreen():S.screen==='club'?club():S.screen==='player'?playerScreen():S.screen==='swap'?swapScreen():S.screen==='crest'?crestScreen():S.screen==='h2h'?h2h():S.screen==='draft'?draft():S.screen==='ladder'?ladderIntro():S.screen==='final'?(S.game&&S.game.cfg.ladder?ladderEnd():final()):game();
  placeBar();
  if(S.screen==='game'){const gg=G().g;if(gg.phase!==gg.tPhaseName){gg.tPhaseName=gg.phase;gg.tPhase=Date.now()}}
  if(S.screen==='game'&&G().g.phase==='splash')runSplash();
  save();
}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function hasSave(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');return !!(s&&s.game&&!s.game.g.over)}catch(e){return false}}

const val=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
async function doLogin(){
  const nm=val('li-name'),pin=val('li-pin');S.ui.lname=nm;
  if(!nm||!pin){T.msg='Enter your team name and PIN.';render();return}
  T.busy=true;T.msg='';render();
  const r=await FCStore.login(nm,pin);T.busy=false;
  if(r.error){T.msg=r.error;render();return}
  if(S.ui.lfor==='p2'){
    if(T.me&&r.team.name.toLowerCase()===T.me.name.toLowerCase()){T.msg='That team is already Player 1.';render();return}
    T.p2={team:r.team,token:r.token};S.h2h=S.h2h||{p1:T.me?'team':'casual'};S.h2h.p2='team';S.screen='h2h';
  }else{T.me=r.team;T.token=r.token;setSession();S.screen='home';loadBoard(true)}
  render();
}
function newTeamStart(){
  const nm=val('li-name'),pin=val('li-pin');S.ui.lname=nm;
  if(!FCStore.validName(nm)){T.msg='Team names are 2–16 characters: letters, numbers, spaces, . \' or -.';return}
  if(!FCStore.validPin(pin)){T.msg='Choose a 4-digit PIN.';return}
  PIN.v=pin;T.msg='';
  const pick=(arr,n)=>arr.map(x=>[rnd(),x.id]).sort((a,b)=>a[0]-b[0]).slice(0,n).map(x=>x[1]);
  const st=k=>(k==='B'?BATTERS:PITCHERS);
  S.starter={name:nm,stars:[...pick(st('B').filter(p=>p.dots===3),2),...pick(st('P').filter(p=>p.dots===3),1)],mids:[...pick(st('B').filter(p=>p.dots===2),2),...pick(st('P').filter(p=>p.dots===2),2)],star:null,mid:null,crest:crestOf({name:nm})};
  S.screen='starter';window.scrollTo(0,0);
}
async function createTeam(){
  const s=S.starter;if(!s||!s.star||!s.mid)return;
  if(!PIN.v){T.msg='Please re-enter your PIN.';S.screen='login';S.ui.ltab='new';render();return}
  T.busy=true;T.msg='';render();
  const r=await FCStore.create(s.name,PIN.v,{...newTeamData(s.name,starterTeam(s)),crest:s.crest||crestOf({name:s.name})});T.busy=false;
  if(r.error){T.msg=r.error+(/taken/i.test(r.error)?' Go back to pick another name.':'');render();return}
  T.me=r.team;T.token=r.token;PIN.v='';S.starter=null;setSession();if(FCStore.fellBack)T.msg='Your team is saved in this browser only: this copy of the game is view-only for you, so it can\'t save to the shared team list.';S.ui.ctab='team';S.screen='club';loadBoard(true);render();
}
function h2hGo(){
  const h=S.h2h,a=h.p1==='team'&&T.me,b=h.p2==='team'&&T.p2;T.msg='';
  if(a&&b){const s1=sideFrom(T.me.roster,'A',T.me.name,{mgr:'me'}),s2=sideFrom(T.p2.team.roster,'B',T.p2.team.name,{mgr:'p2'});S.lastTeams=[s1,s2];startGame(S.cfg,[s1,s2]);window.scrollTo(0,0);return}
  if(a||b){const tm=a?T.me:T.p2.team,mg=a?'me':'p2',saved={name:tm.name,mgr:mg,draft:false},cas={name:a?'Player 2':'Player 1',roster:[],draft:true};
    S.draft={idx:a?1:0,tab:'B',kind:'mirror',q:tierQuota(tm.roster),lvl:avgLvl(tm.roster),vs:tm.name,teams:a?[saved,cas]:[cas,saved]};S.screen='draft';return}
  S.draft={idx:0,tab:'B',kind:'exh',teams:[{name:'Player 1',roster:[],draft:true},{name:'Player 2',roster:[],draft:true}]};S.screen='draft';
}
function draftDone(){
  const d=S.draft,nxt=d.teams.findIndex((x,i)=>i>d.idx&&x.draft);if(nxt>=0){d.idx=nxt;d.tab='B';return}
  const sides=d.teams.map((x,i)=>{const tag=i?'B':'A';
    if(x.mgr){const tm=x.mgr==='me'?T.me:T.p2.team;return sideFrom(tm.roster,tag,tm.name,{mgr:x.mgr})}
    if(x.cpu)return {name:'CPU',human:false,roster:cpuRoster(S.cfg.budget)};
    if(d.kind==='mirror')return sideFrom(x.roster.map(id=>autoBuild(id,d.lvl)),tag,x.name,{});
    return {name:x.name,human:true,roster:[...x.roster]}});
  S.lastTeams=sides;startGame(S.cfg,sides);
}
function regInst(){[...(S.game?S.game.teams:[]),...(S.lastTeams||[])].forEach(t=>(t.inst||[]).forEach(x=>{ALL[x.id]=x}))}
function act(a,ds){
  const g=S.game&&S.game.g, N=S.game?S.game.cfg.N:S.cfg.N;
  switch(a){
    case 'cfg-inn':S.cfg.innings=+ds.v;break;
    case 'cfg-n':S.cfg.N=+ds.v;break;
    case 'cfg-st':S.cfg.stamina=ds.v==='on';break;
    case 'cfg-bud':S.cfg.budget=+ds.v;break;
    case 'home':S.screen='home';T.msg='';loadBoard();break;
    case 'cfg-mode':S.cfg.mode=ds.v;T.msg='';break;
    case 'go-login':S.ui=S.ui||{};S.ui.lfor=ds.v==='p2'?'p2':'me';S.ui.ltab=ds.v==='p2'?'in':ds.v;T.msg='';S.screen='login';window.scrollTo(0,0);break;
    case 'ltab':S.ui.ltab=ds.v;T.msg='';break;
    case 'do-login':doLogin();return;
    case 'new-team':newTeamStart();break;
    case 'st-star':S.starter.star=ds.v;break;
    case 'st-mid':S.starter.mid=ds.v;break;
    case 'create-team':createTeam();return;
    case 'st-crest':if(S.starter){S.starter.crest={...crestOf({name:S.starter.name,crest:S.starter.crest}),[ds.k]:ds.v}}break;
    case 'crest-set':if(T.me){T.me.crest={...crestOf(T.me),[ds.k]:ds.v};saveTeam()}break;
    case 'go-crest':if(T.me){S.screen='crest';window.scrollTo(0,0)}break;
    case 'logout':T.me=null;T.token=null;T.msg='';setSession();S.ladder=null;if(S.h2h)S.h2h.p1='casual';break;
    case 'club':if(!T.me){S.screen='home';break}if(S.ui)S.ui.pend={};S.screen='club';S.swap=null;T.msg='';window.scrollTo(0,0);break;
    case 'ctab':S.ui=S.ui||{};S.ui.ctab=ds.v;break;
    case 'pl':S.ui.pidx=+ds.v;S.ui.pend={};S.screen='player';window.scrollTo(0,0);break;
    case 'lvl-up':{const t=T.me,e=t.roster[S.ui.pidx],c=LVL_COST[tierOf(e.id)][e.lvl];if(e.lvl<MAX_LVL&&t.coins>=c){t.coins-=c;e.lvl++;saveTeam()}break}
    case 'bp-add':{const e0=T.me.roster[S.ui.pidx],P={...pendOf()},e=withPend(e0,P),o=upgradeOpts(ALL[e0.id]).find(x=>x.k===ds.v);if(o&&bpFree(e)>0&&(e.bp[o.k]||0)<o.max){P[o.k]=(P[o.k]||0)+1;if(ds.pick)P.secName=ds.pick;S.ui.pend=P}break}
    case 'bp-undo':{const P={...pendOf()};if(P[ds.v]){P[ds.v]--;if(!P[ds.v]){delete P[ds.v];if(ds.v==='sec')delete P.secName}}S.ui.pend=P;break}
    case 'bp-clear':S.ui.pend={};break;
    case 'bp-confirm':{const t=T.me,e0=t.roster[S.ui.pidx],P=pendOf();if(pendCount(P)&&bpFree(withPend(e0,P))>=0){t.roster[S.ui.pidx]=withPend(e0,P);S.ui.pend={};saveTeam()}break}
    case 'respec':{const t=T.me,e=t.roster[S.ui.pidx],c=RESPEC*tierOf(e.id);if(t.coins>=c&&bpSpent(e)){t.coins-=c;e.bp={};S.ui.pend={};saveTeam()}break}
    case 'buy':{const c=PRICE[ALL[ds.v].dots];if(T.me.coins>=c){S.swap={id:ds.v,price:c,from:'shop'};S.screen='swap';window.scrollTo(0,0)}break}
    case 'shop-refresh':{const t=T.me,fr=t.freeRoll!==todayKey();if(fr||t.coins>=REFRESH_COST){if(fr)t.freeRoll=todayKey();else t.coins-=REFRESH_COST;t.shop=rollShop(t,Math.random());saveTeam()}break}
    case 'pack-open':{const t=T.me;if(t.coins>=PACK_COST&&!S.pack){const id=packDraw(t);if(id){t.coins-=PACK_COST;S.pack=id;saveTeam()}}break}
    case 'pack-keep':if(S.pack){S.swap={id:S.pack,price:0,from:'pack'};S.screen='swap';window.scrollTo(0,0)}break;
    case 'pack-cash':if(S.pack){T.me.coins+=CASH[ALL[S.pack].dots];S.pack=null;saveTeam()}break;
    case 'scout-open':if(T.me.picks>0&&!S.offer)S.offer=scoutOffer(T.me);break;
    case 'scout-take':if(S.offer&&S.offer.includes(ds.v)){S.swap={id:ds.v,price:0,from:'scout'};S.screen='swap';window.scrollTo(0,0)}break;
    case 'swap-cancel':S.swap=null;S.screen='club';break;
    case 'swap-release':{const t=T.me,sw=S.swap,i=+ds.v,out=ALL[t.roster[i].id],nb=rosterB(t),inn=ALL[sw.id];
      const ok=out.kind===inn.kind||(out.kind==='B'?nb>1:t.roster.length-nb>1);if(!ok||t.coins<sw.price)break;
      t.coins-=sw.price;t.roster[i]={id:sw.id,lvl:1,bp:{}};if(sw.from==='pack')S.pack=null;if(sw.from==='scout'){t.picks--;S.offer=null}
      if(t.shop)t.shop=t.shop.filter(x=>x!==sw.id);saveTeam();S.swap=null;S.screen='club';S.ui.ctab='team';break}
    case 'start-cpu':{const t=T.me,lvl=avgLvl(t.roster),me=sideFrom(t.roster,'A',t.name,{mgr:'me'});
      const cpu=sideFrom(mirrorRoster(t.roster,t.roster.map(e=>e.id)).map(id=>autoBuild(id,lvl)),'C','CPU',{human:false});
      S.lastTeams=[me,cpu];startGame(S.cfg,[me,cpu]);window.scrollTo(0,0);break}
    case 'exh-cpu':S.draft={idx:0,tab:'B',kind:'exh',teams:[{name:'You',roster:[],draft:true},{name:'CPU',roster:[],draft:false,cpu:true}]};S.screen='draft';window.scrollTo(0,0);break;
    case 'go-h2h':S.h2h=S.h2h||{p1:T.me?'team':'casual',p2:T.p2?'team':'casual'};if(!T.me)S.h2h.p1='casual';if(!T.p2)S.h2h.p2='casual';T.msg='';S.screen='h2h';window.scrollTo(0,0);break;
    case 'h2h-use':{const k='p'+ds.v;S.h2h[k]=S.h2h[k]==='team'?'casual':'team';break}
    case 'p2-logout':T.p2=null;S.h2h.p2='casual';break;
    case 'h2h-go':h2hGo();break;
    case 'ladder-start':case 'ladder-restart':if(T.me)newLadder();window.scrollTo(0,0);break;
    case 'lad-sit':if(S.ladder)S.ladder.sit=+ds.v;break;
    case 'ladder-play':startLadderGame();window.scrollTo(0,0);break;
    case 'ladder-resume':S.screen='ladder';break;
    case 'ladder-next':S.screen='ladder';window.scrollTo(0,0);break;
    case 'toggle':{const d=S.draft,r=d.teams[d.idx].roster,i=r.indexOf(ds.v),p=ALL[ds.v];if(i>=0){r.splice(i,1);break}
      if(r.length>=ROSTER)break;if(d.kind==='mirror'){if(r.filter(id=>ALL[id].dots===p.dots).length<d.q[p.dots])r.push(ds.v)}
      else if(cost(r)+p.dots+(ROSTER-r.length-1)<=S.cfg.budget)r.push(ds.v);break}
    case 'auto':{const d=S.draft,r=d.teams[d.idx];const st=r.roster.length===ROSTER?[]:r.roster;r.roster=d.kind==='mirror'?fillMirror(st,d.q):fillRoster(st,S.cfg.budget);break}
    case 'draft-done':draftDone();window.scrollTo(0,0);break;
    case 'report-next':case 'next':if(g.over){if(S.game.cfg.ladder)finishLadderGame();recordGame();logGame();S.screen='final'}else beginPitch();window.scrollTo(0,0);break;

    case 'resume':try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));S.game=s.game;S.cfg=s.cfg;S.lastTeams=s.lastTeams;S.ladder=s.ladder||S.ladder;regInst();S.screen='game'}catch(e){}break;
    case 'tab':S.draft.tab=ds.v;break;
    case 'mound':team(defI()).pitcher=ds.v;g.ps.type=null;break;
    case 'p-type':g.ps.type=ds.v;break;
    case 'p-eff':g.ps.effort=ds.v;g.ps.win=autoIdx(pitchAreas(ds.v,N));break;
    case 'p-ball':g.ps.ball=!g.ps.ball;break;
    case 'cell':{const r=+ds.r,c=+ds.c;if(ds.who==='p'&&(r<0||r>=N||c<0||c>=N)){g.ps.ball=true;g.ps.ballCell={r,c};g.ps.pitchout=false;if(g.ps.hold==='pitchout')g.ps.hold='none';break}if(ds.who==='p'){g.ps.ball=false;g.ps.pitchout=false;if(g.ps.hold==='pitchout')g.ps.hold='none';g.ps.win=tapArea(pitchAreas(g.ps.effort,N),r,c,g.ps.win)}else{g.bs.win=tapArea(batAreas(g.bs.power,N),r,c,g.bs.win)}break}
    case 'lock-p':lockPitch();break;
    case 'show-p':g.phase='pitch';break;
    case 'show-b':g.phase='bat';break;
    case 'b-take':g.bs.take=ds.v==='take';break;
    case 'b-type':g.bs.type=ds.v;break;
    case 'b-pow':g.bs.power=ds.v;g.bs.win=autoIdx(batAreas(ds.v,N));break;
    case 'lock-b':g.bs.ms=g.tPhase?Date.now()-g.tPhase:null;doResolve();break;
    case 'splash-next':{const L=g.last;if(L.paEnd||g.over||L.res.steal||L.extra)g.phase='report';else beginPitch();window.scrollTo(0,0);break}
    case 'p-hold':g.ps.hold=ds.v;g.ps.pitchout=ds.v==='pitchout';if(ds.v==='pitchout'){g.ps.ball=true;g.ps.ballCell={r:Math.floor(N/2),c:N}}else if(g.ps.ball&&g.ps.ballCell&&g.ps.ballCell.c===N&&g.ps.ballCell.r===Math.floor(N/2)){g.ps.ball=false;g.ps.ballCell=null}if(ds.v==='quick'&&g.ps.effort==='max'){g.ps.effort='normal';g.ps.win=autoIdx(pitchAreas('normal',N))}break;
    case 'b-steal':g.bs.steal=ds.v==='go';break;
    case 'cfg-role':S.cfg.role=ds.v;break;
    case 'cfg-rev':S.cfg.reveal=ds.v;break;
    case 'rev-set':S.cfg.reveal=ds.v;if(S.game)S.game.cfg.reveal=ds.v;break;
    case 'cfg-ghost':S.cfg.ghost=S.cfg.ghost===false;break;
    case 'cfg-stam':S.cfg.stamina=!S.cfg.stamina;break;
    case 'cfg-music':S.cfg.music=S.cfg.music===false;musicSync();break;
    case 'toggle-settings':S.ui=S.ui||{};S.ui.settings=!S.ui.settings;break;
    case 'toggle-how':S.ui=S.ui||{};S.ui.how=!S.ui.how;if(S.ui.how)setTimeout(()=>{const d=document.getElementById('how');if(d)d.scrollIntoView({behavior:'smooth',block:'start'})},30);break;
    case 'lb-all':S.ui=S.ui||{};S.ui.lbAll=!S.ui.lbAll;break;
    case 'toggle-scout':S.ui=S.ui||{};S.ui.scout=!S.ui.scout;break;
    case 'clear':S.draft.teams[S.draft.idx].roster=[];break;
    case 'rematch':regInst();startGame(S.game.cfg,S.lastTeams||S.game.teams);break;
    case 'newgame':S.screen='home';S.game=null;break;
  }
  render();
}
function boot(d){
  S=(d&&d.S&&d.S.v===3)?d.S:freshState();regInst();if(!S.ui)S.ui={};
  S.cfg={...DEF_CFG,...S.cfg};S.cfg.music=false;  /* music always starts muted */if(S.cfg.budget<10)S.cfg.budget=12;
  render();
  let swiped=0;
  document.addEventListener('click',e=>{if(Date.now()-swiped<450){e.preventDefault();return}const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const a=t.dataset.a;
    if(a==='splash-next'){nextSplash();return}if(a==='splash-back'){backSplash();return}if(a==='splash-go'){goSplash(+t.dataset.v);return}if(a==='replay-field'){const r=app.querySelector('.splash');if(r)animBall(r,1000);return}act(a,t.dataset)});
  let mDrag=null;const mFrac=(tr,e)=>{const r=tr.getBoundingClientRect();return Math.max(0,Math.min(.999,(e.clientX-r.left-5)/(r.width-10)))};
  document.addEventListener('pointerdown',e=>{const tr=e.target.closest&&e.target.closest('.m-track');if(!tr)return;e.preventDefault();mDrag={tr,el:tr.closest('.meter')};try{tr.setPointerCapture(e.pointerId)}catch(_){}tr.classList.add('drag');meterLive(mDrag.el,mFrac(tr,e),false)});
  document.addEventListener('pointermove',e=>{if(mDrag)meterLive(mDrag.el,mFrac(mDrag.tr,e),false)});
  const mEnd=e=>{if(!mDrag)return;const d=mDrag;mDrag=null;d.tr.classList.remove('drag');meterLive(d.el,mFrac(d.tr,e),true)};
  document.addEventListener('pointerup',mEnd);document.addEventListener('pointercancel',mEnd);
  document.addEventListener('keydown',e=>{const tr=e.target.closest&&e.target.closest('.m-track');if(!tr)return;const step=e.key==='ArrowLeft'||e.key==='ArrowDown'?-1:e.key==='ArrowRight'||e.key==='ArrowUp'?1:0;if(!step)return;e.preventDefault();e.stopImmediatePropagation();
    const el=tr.closest('.meter'),n=Math.max(0,Math.min(2,(+tr.getAttribute('aria-valuenow')<0?1:+tr.getAttribute('aria-valuenow'))+step));meterLive(el,(n*2+1)/6,true);requestAnimationFrame(()=>{const t2=document.querySelector(`[data-meter="${el.dataset.meter}"] .m-track`);if(t2)t2.focus()})},true);
  let tx=null,ty=null;
  document.addEventListener('touchstart',e=>{const sp=e.target.closest&&e.target.closest('.splash');if(!sp||e.touches.length>1){tx=null;return}tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
  document.addEventListener('touchend',e=>{if(tx==null)return;const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;tx=null;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){swiped=Date.now();if(dx<0)nextSplash();else backSplash()}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&(e.target.id==='li-pin'||e.target.id==='li-name')){const b=document.querySelector('[data-a=do-login],[data-a=new-team]');if(b)b.click();return}if(!S||S.screen!=='game'||!G()||G().g.phase!=='splash')return;if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
    if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){e.preventDefault();nextSplash()}else if(e.key==='ArrowLeft'){e.preventDefault();backSplash()}});
  try{window.claude&&window.claude.hot&&window.claude.hot.snapshot(()=>({S}))}catch(e){}
  initStore();
  document.addEventListener('visibilitychange',musicSync);
  { const b=document.getElementById('musicbtn');if(b){b.setAttribute('aria-pressed',String(S.cfg.music!==false))} }
  document.addEventListener('input',e=>{if(e.target&&e.target.id==='li-name'){const c=document.getElementById('li-count');if(c)c.textContent=e.target.value.length+'/16'}});
  document.addEventListener('input',e=>{if(e.target&&e.target.id==='innings'){S.cfg.innings=+e.target.value;const v=document.getElementById('innval');if(v)v.textContent=e.target.value;save()}});
  try{['art/pitcher.jpg','art/batter.jpg','art/result.jpg','art/clubhouse.jpg'].forEach(u=>{const im=new Image();im.src=u})}catch(e){}
}
if(app){const h=window.claude&&window.claude.hot;h&&h.ready?h.ready(boot):boot(h&&h.data||{})}
